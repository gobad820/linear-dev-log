name: Linear Issue Linker

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  link-issue:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Extract Linear Issue Key
        id: extract_key
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ $BRANCH_NAME =~ (SSA-[0-9]+) ]]; then
            echo "issue_key=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Issue Details from Linear
        if: steps.extract_key.outputs.issue_key != ''
        id: linear_data
        uses: actions/github-script@v6
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          script: |
            const issueKey = '${{ steps.extract_key.outputs.issue_key }}';
            const apiKey = process.env.LINEAR_API_KEY;
            
            if (!apiKey) {
              console.log("LINEAR_API_KEY secret is not set.");
              return;
            }

            try {
              const query = `query { issue(id: "${issueKey}") { title description } }`;
              const response = await fetch('https://api.linear.app/graphql', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': apiKey },
                body: JSON.stringify({ query })
              });
              const { data } = await response.json();
              if (data && data.issue) {
                core.setOutput('title', data.issue.title);
                core.setOutput('description', data.issue.description || '');
              }
            } catch (e) {
              console.log("Error fetching from Linear:", e);
            }

      - name: Update PR Description
        if: steps.extract_key.outputs.issue_key != ''
        uses: actions/github-script@v6
        with:
          script: |
            const issueKey = '${{ steps.extract_key.outputs.issue_key }}';
            const issueTitle = `${{ steps.linear_data.outputs.title }}`.trim();
            const issueDesc = `${{ steps.linear_data.outputs.description }}`.trim();
            
            const workspace = 'ssafy-test-workspace';
            const linearUrl = `https://linear.app/${workspace}/issue/${issueKey}`;
            const badgeKey = issueKey.replace(/-/g, '--');
            const badge = `[![Linear](https://img.shields.io/badge/Linear-${badgeKey}-5E6AD2)](${linearUrl})`;
            
            let currentBody = context.payload.pull_request.body || '';
            
            // 뱃지가 이미 있는지 확인 (없을 때만 추가하거나, 기존 것 교체)
            const badgeIdentifier = `https://img.shields.io/badge/Linear-${badgeKey}`;
            
            if (!currentBody.includes(badgeIdentifier)) {
              // 기존 배지 패턴 제거 (다른 번호의 배지가 있을 경우 대비)
              currentBody = currentBody.replace(/\[\!\[Linear\].*?\n+/g, '');
              
              const headerContent = issueTitle ? `### 📋 ${issueTitle}\n\n${issueDesc}\n\n---\n` : '';
              const newBody = `${badge}\n\n${headerContent}${currentBody}`;
              
              github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: newBody
              });
            }
