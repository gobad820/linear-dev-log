name: Linear Issue Linker

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  link-issue:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Extract Linear Issue Key
        id: extract_key
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ $BRANCH_NAME =~ (SSA-[0-9]+) ]]; then
            echo "issue_key=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "Found Linear Issue: ${BASH_REMATCH[1]}"
          else
            echo "No Linear issue key found in branch name."
          fi

      - name: Update PR Description
        if: steps.extract_key.outputs.issue_key != ''
        uses: actions/github-script@v6
        with:
          script: |
            const issueKey = '${{ steps.extract_key.outputs.issue_key }}';
            const workspace = 'ssafy-test-workspace';
            const linearUrl = `https://linear.app/${workspace}/issue/${issueKey}`;
            // Shields.io 정적 배지 주소 (로고 제외하여 안정성 확보)
            const badge = `[![Linear](https://img.shields.io/badge/Linear-${issueKey}-5E6AD2)](${linearUrl})`;
            
            let currentBody = context.payload.pull_request.body || '';
            
            // 1. 기존에 잘못 들어간 Linear 배지나 링크가 있다면 제거 (중복 방지)
            const regex = /\[\!\[Linear\].*?\n\n/g;
            const cleanedBody = currentBody.replace(regex, '');
            
            // 2. 무조건 맨 위에 최신 배지 삽입
            const newBody = `${badge}\n\n${cleanedBody}`;
            
            if (currentBody !== newBody) {
              github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: newBody
              });
              console.log(`Successfully updated/replaced PR body with Linear link for ${issueKey}`);
            }
