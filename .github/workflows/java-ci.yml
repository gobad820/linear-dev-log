name: Java CI Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven (Score App)
      run: |
        if [ -d "backend/score-app" ]; then
          cd backend/score-app
          mvn -B package --file pom.xml
        fi
        
    - name: Build with Maven (Score MVC App)
      run: |
        if [ -d "backend/score-mvc-app" ]; then
          cd backend/score-mvc-app
          mvn -B package --file pom.xml
        fi
        
    - name: Build with Maven (Score Service App)
      run: |
        if [ -d "backend/score-service-app" ]; then
          cd backend/score-service-app
          mvn -B package --file pom.xml
        fi
